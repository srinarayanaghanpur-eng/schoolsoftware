<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NarayanaOS Mobile — Interactive Redesign Demo</title>
<style>
/* ============================================================
   1. PRIMITIVES — raw palette. Components never use these.
   ============================================================ */
:root{
  --indigo-50:#EFEDFB; --indigo-100:#E3DEF9; --indigo-200:#C8BEF3; --indigo-300:#A796EC;
  --indigo-400:#876BE7; --indigo-500:#6D4AFF; --indigo-600:#5840D8; --indigo-700:#3B2FA3;
  --indigo-800:#2C227C; --indigo-900:#1D1755; --indigo-950:#120D36;
  --marigold-100:#FDECC6; --marigold-200:#FADB92; --marigold-300:#F7C95F;
  --marigold-400:#F4B740; --marigold-500:#E2A32A; --marigold-700:#966313; --marigold-900:#432A07;
  --mint-50:#E8F8F2; --mint-200:#97E2C9; --mint-500:#12A87A; --mint-700:#0B6B4E; --mint-900:#052F23;
  --coral-50:#FDEDED; --coral-300:#F08084; --coral-500:#E5484D; --coral-700:#A02529; --coral-900:#4A1012;
  --sky-50:#EBF3FE; --sky-300:#7FADF9; --sky-500:#2E7CF6; --sky-700:#154BA6; --sky-900:#0A224C;
  --n0:#FFFFFF; --n25:#FBFAFE; --n50:#F6F5FB; --n75:#F1EFF9; --n100:#ECE9F6;
  --n200:#DEDAF0; --n300:#C9C3E4; --n400:#A9A4C2; --n500:#757096; --n600:#4C4870;
  --n700:#2E2A4D; --n800:#1D1A33; --n900:#12102A; --n950:#0A0818;

  /* ============================================================
     2. SEMANTIC — light theme
     ============================================================ */
  --bg:var(--n50); --surface:var(--n0); --surface-raised:var(--n0);
  --surface-sunken:var(--n75); --surface-tint:#ECE8FF; --surface-inverse:var(--n900);
  --scrim:rgba(18,16,42,.48); --scrim-strong:rgba(18,16,42,.72);
  --skeleton:#ECE9F6; --skeleton-highlight:#F7F5FD;

  --text:var(--n900); --text-secondary:var(--n600); --text-tertiary:var(--n500);
  --text-disabled:var(--n400); --text-inverse:#FFFFFF; --text-on-primary:#FFFFFF;
  --text-link:var(--indigo-700); --text-accent:#8A5A0A; --text-success:var(--mint-700);
  --text-danger:#B3262B; --text-info:var(--sky-700);

  --border-subtle:var(--n100); --border:var(--n200); --border-strong:var(--n300);
  --border-focus:var(--indigo-500); --border-danger:var(--coral-500); --divider:var(--n100);
  --nav-border:rgba(18,16,42,.06);

  --primary:var(--indigo-700); --primary-pressed:var(--indigo-800); --primary-disabled:var(--indigo-200);
  --on-primary:#FFFFFF; --primary-container:#ECE8FF; --on-primary-container:#1C1550;
  --primary-subtle:#F4F1FF; --grad-a:var(--indigo-700); --grad-b:var(--indigo-500);
  --accent:var(--marigold-400); --accent-pressed:var(--marigold-500); --accent-container:#FEF3D6;
  --on-accent:var(--n900); --on-accent-container:#4A3208;

  --success:var(--mint-500); --success-container:var(--mint-50); --on-success-container:#08402F;
  --warning:var(--marigold-400); --warning-container:#FEF3D6; --on-warning-container:#4A3208;
  --danger:var(--coral-500); --danger-container:var(--coral-50); --on-danger-container:#5C0F13;
  --info:var(--sky-500); --info-container:var(--sky-50); --on-info-container:#0F3470;

  --badge-neutral-bg:var(--n75); --badge-neutral-text:var(--n600);
  --tile-lav:#ECE8FF; --tile-lav-fg:#3B2FA3; --tile-peach:#FFE9D6; --tile-peach-fg:#A34E0E;
  --tile-mint:#DDF6EC; --tile-mint-fg:#0B6B4E; --tile-sky:#E3EFFE; --tile-sky-fg:#154BA6;
  --tile-lemon:#FEF4D2; --tile-lemon-fg:#8A5A0A; --tile-rose:#FDE4E8; --tile-rose-fg:#A02529;

  --shadow-xs:0 1px 2px rgba(18,16,42,.04);
  --shadow-sm:0 2px 8px rgba(18,16,42,.06);
  --shadow-md:0 8px 24px rgba(18,16,42,.08);
  --shadow-lg:0 16px 40px rgba(18,16,42,.12);
  --shadow-xl:0 24px 64px rgba(18,16,42,.18);
  --shadow-primary:0 12px 28px rgba(59,47,163,.28);
  --highlight:inset 0 1px 0 rgba(255,255,255,.60);

  /* ============================================================
     3. SYSTEM — spacing, radii, motion, controls
     ============================================================ */
  --s0:2px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:48px; --s10:64px;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-hero:28px;
  --r-pill:999px; --r-full:9999px;
  --tap:44px; --control-h:48px; --control-h-lg:52px; --input-h:52px; --chip-h:34px;
  --nav-h:64px; --header-h:56px;
  --motion-press:.96; --motion-press-fast:140ms;
  --motion-enter:240ms; --motion-enter-slow:280ms; --motion-exit:160ms;
  --motion-push:260ms; --motion-pop:220ms; --motion-tab:180ms;
  --ease-spring:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.4,0,1,1); --ease-smooth:cubic-bezier(.22,1,.36,1);
  --z-header:30; --z-nav:40; --z-scrim:50; --z-sheet:60; --z-toast:70; --z-confetti:80;
  --font-head:"Plus Jakarta Sans","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"DM Sans","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}

/* Dark theme — every semantic colour is overridden. */
[data-theme="dark"]{
  --bg:#0E0C1F; --surface:#16142E; --surface-raised:#1D1A3A;
  --surface-sunken:#0A0818; --surface-tint:#221C46; --surface-inverse:#F4F3FA;
  --scrim:rgba(0,0,0,.66); --scrim-strong:rgba(0,0,0,.82);
  --skeleton:#242040; --skeleton-highlight:#2E2950;

  --text:#F4F3FA; --text-secondary:#C3BFE0; --text-tertiary:#938DB8;
  --text-disabled:#615C85; --text-inverse:#12102A;
  --text-link:#B9A8FF; --text-accent:#F4B740; --text-success:#6DE7BE;
  --text-danger:#FF9A9D; --text-info:#9CC0FF;

  --border-subtle:#241F42; --border:#2E2950; --border-strong:#3E3866;
  --border-focus:#A594EB; --border-danger:#F08A8D; --divider:#241F42;
  --nav-border:rgba(255,255,255,.08);

  --primary:#7C5CFF; --primary-pressed:#6A4BEB; --primary-disabled:#332C5C;
  --primary-container:#241C4D; --on-primary-container:#DCD4FF; --primary-subtle:#1B1638;
  --grad-a:#5B3FE0; --grad-b:#8B6CFF;
  --accent-container:#3A2A0B; --on-accent-container:#FCE3A6;

  --success:#2FD3A0; --success-container:#0E2F26; --on-success-container:#C9F7E6;
  --warning:#F7C95F; --warning-container:#3A2A0B; --on-warning-container:#FCE3A6;
  --danger:#FF7A7E; --danger-container:#3A1418; --on-danger-container:#FFD9DA;
  --info:#5B9BFF; --info-container:#12294A; --on-info-container:#CDE0FF;

  --badge-neutral-bg:#242040; --badge-neutral-text:#C3BFE0;
  --tile-lav:#2A2350; --tile-lav-fg:#C3B4FF; --tile-peach:#3A2418; --tile-peach-fg:#FFC79B;
  --tile-mint:#123528; --tile-mint-fg:#6DE7BE; --tile-sky:#172B47; --tile-sky-fg:#9CC0FF;
  --tile-lemon:#372C0F; --tile-lemon-fg:#F7D77A; --tile-rose:#3A1E24; --tile-rose-fg:#FFA9AF;

  --shadow-xs:0 1px 2px rgba(0,0,0,.32);
  --shadow-sm:0 2px 8px rgba(0,0,0,.36);
  --shadow-md:0 8px 24px rgba(0,0,0,.44);
  --shadow-lg:0 16px 40px rgba(0,0,0,.50);
  --shadow-xl:0 24px 64px rgba(0,0,0,.58);
  --shadow-primary:0 12px 28px rgba(109,74,255,.32);
  --highlight:inset 0 1px 0 rgba(255,255,255,.06);
}

/* ============================================================
   4. BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow-x:hidden;background:
    radial-gradient(900px 500px at 12% -10%,rgba(109,74,255,.16),transparent 60%),
    radial-gradient(700px 400px at 92% 8%,rgba(244,183,64,.12),transparent 55%),
    #E9E7EF;
  color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
a{color:var(--text-link)}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:6px}
:focus:not(:focus-visible){outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:18px;height:18px}
.icon-lg{width:26px;height:26px}
.tile-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.tile-icon .icon{width:20px;height:20px}
.spin{display:inline-flex;align-items:center;justify-content:center;animation:spin 900ms linear infinite}
.spin .icon{width:20px;height:20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   5. PAGE / STAGE / PHONE
   ============================================================ */
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 16px 18px;gap:16px}
.demo-head{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo-brand{display:flex;align-items:center;gap:10px}
.demo-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;
  font:800 19px/1 var(--font-head);box-shadow:var(--shadow-primary)
}
.demo-brand strong{display:block;font:800 16px/1.2 var(--font-head);color:var(--n900);letter-spacing:-.2px}
.demo-brand span{display:block;font-size:12px;color:var(--n500);margin-top:2px}
.demo-actions{display:flex;gap:6px;flex-wrap:wrap}
.demo-actions button{
  min-height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.72);
  border:1px solid rgba(18,16,42,.10);color:#3B3555;font-size:12px;font-weight:600;
  backdrop-filter:blur(8px);transition:background 160ms,transform 160ms,box-shadow 160ms
}
.demo-actions button:hover{background:#fff;box-shadow:0 4px 14px rgba(18,16,42,.08)}
.demo-actions button:active{transform:scale(.96)}
.demo-actions button[aria-pressed="true"]{background:var(--indigo-700);color:#fff;border-color:transparent}
.stage-wrap{position:relative;display:grid;place-items:start center;width:100%}
.stage{width:390px;height:844px;transform-origin:top center;will-change:transform}
.stage-caption{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#7A748F;text-align:center}
.phone{
  width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;isolation:isolate;
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 40px 90px rgba(24,16,60,.30),0 8px 24px rgba(24,16,60,.14),inset 0 0 0 1px rgba(18,16,42,.04);
  transition:background 200ms ease,color 200ms ease
}
.phone::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 18%);mix-blend-mode:screen
}
.statusbar{
  flex:0 0 47px;height:47px;padding:0 24px 0 28px;display:flex;align-items:center;
  justify-content:space-between;font:600 13.5px/1 var(--font-head);color:var(--text);
  position:relative;z-index:var(--z-header);letter-spacing:.1px
}
.statusbar .sb-right{display:flex;align-items:center;gap:5px}
.statusbar .icon{width:17px;height:17px;stroke-width:2}
.appbar{
  flex:0 0 auto;min-height:56px;padding:4px 12px 8px 8px;display:flex;align-items:center;gap:6px;
  position:relative;z-index:var(--z-header);background:var(--bg);transition:background 200ms
}
.appbar[hidden]{display:none}
.appbar .bar-title{min-width:0;flex:1;padding-left:2px}
.appbar h1{font:800 17px/1.25 var(--font-head);letter-spacing:-.2px;color:var(--text);margin:0}
.appbar .bar-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:1px}
.appbar .bar-actions{display:flex;align-items:center;gap:6px}
#app{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;position:relative;background:var(--bg)}
#app::-webkit-scrollbar{display:none}
.screen{padding:0 20px 26px;min-height:100%;animation:enter var(--motion-enter) var(--ease-out) both}
.screen.flush{padding-left:0;padding-right:0}
.screen.anim-push{animation:pushIn var(--motion-push) var(--ease-smooth) both}
.screen.anim-pop{animation:popIn var(--motion-pop) var(--ease-out) both}
.screen.anim-fade{animation:fadeIn var(--motion-tab) ease-out both}
.bottom-nav{
  flex:0 0 auto;height:78px;padding:6px 10px 14px;display:flex;align-items:flex-start;justify-content:space-around;
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid var(--nav-border);position:relative;z-index:var(--z-nav);box-shadow:0 -2px 14px rgba(18,16,42,.04)
}
.bottom-nav:empty{display:none}
.nav-item{
  flex:0 0 auto;min-width:56px;min-height:56px;padding:5px 8px 4px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--text-tertiary);border-radius:16px;
  transition:color 160ms,transform var(--motion-press-fast) var(--ease-spring),background 160ms
}
.nav-item .nav-icon{width:40px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background 180ms,color 180ms}
.nav-item .nav-icon .icon{width:21px;height:21px}
.nav-item span{font-size:10.5px;font-weight:600;letter-spacing:.1px}
.nav-item:active{transform:scale(.94)}
.nav-item[aria-current="page"]{color:var(--primary)}
.nav-item[aria-current="page"] .nav-icon{background:var(--primary-container);color:var(--primary)}
.nav-badge{
  position:absolute;transform:translate(13px,-9px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--danger);color:#fff;font:700 10px/16px var(--font-body);text-align:center
}

/* ============================================================
   6. TYPOGRAPHY & LAYOUT UTILITIES
   ============================================================ */
.display{font:800 28px/34px var(--font-head);letter-spacing:-.6px;color:var(--text)}
.title{font:800 22px/28px var(--font-head);letter-spacing:-.3px;color:var(--text)}
.section-title{font:700 17px/24px var(--font-head);letter-spacing:-.2px;color:var(--text)}
.body{font:400 15px/22px var(--font-body);color:var(--text)}
.body-med{font:500 15px/22px var(--font-body);color:var(--text)}
.label{font:500 13px/18px var(--font-body);color:var(--text-tertiary)}
.caption{font:500 11px/16px var(--font-body);letter-spacing:.2px;color:var(--text-tertiary)}
.overline{font:700 11px/16px var(--font-head);letter-spacing:1px;text-transform:uppercase;color:var(--text-tertiary)}
.num{font:800 22px/28px var(--font-head);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.muted{color:var(--text-tertiary)}
.accent{color:var(--text-accent)}
.success-text{color:var(--text-success)}
.danger-text{color:var(--text-danger)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-5{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spacer{flex:1}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}.mt-6{margin-top:24px}
.hidden{display:none!important}
.text-right{text-align:right}
.divider{height:1px;background:var(--divider);border:0;margin:0}

/* ============================================================
   7. CARDS, TILES, HERO
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow-sm);color:var(--text);position:relative;
  transition:background 200ms,border-color 200ms,box-shadow 200ms
}
.card.tight{padding:12px}
.card.sunken{background:var(--surface-sunken);box-shadow:none;border-color:transparent}
.card.tinted{background:var(--surface-tint);border-color:transparent;box-shadow:none}
.card.success-soft{background:var(--success-container);border-color:transparent;box-shadow:none}
.card.warn-soft{background:var(--warning-container);border-color:transparent;box-shadow:none}
.card.danger-soft{background:var(--danger-container);border-color:transparent;box-shadow:none}
.pressable{cursor:pointer;transition:transform var(--motion-press-fast) var(--ease-spring),background 160ms,box-shadow 160ms}
.pressable:active{transform:scale(.97)}
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-hero);padding:20px;color:#fff;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));box-shadow:var(--shadow-primary);
  transition:background 200ms
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 80% at 88% 0%,rgba(255,255,255,.22),transparent 62%)
}
.hero > *{position:relative;z-index:1}
.hero .overline{color:rgba(255,255,255,.78)}
.hero .h-title{font:800 22px/28px var(--font-head);letter-spacing:-.3px;margin-top:6px}
.hero .h-body{font-size:13px;line-height:19px;color:rgba(255,255,255,.82);margin-top:4px}
.hero .h-amount{font:800 32px/38px var(--font-head);letter-spacing:-.8px;margin-top:6px;font-variant-numeric:tabular-nums}
.btn-hero{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;
  border-radius:999px;background:#fff;color:var(--indigo-700);font:600 14px/1 var(--font-body);
  box-shadow:0 6px 16px rgba(18,16,42,.18);transition:transform var(--motion-press-fast) var(--ease-spring)
}
.btn-hero:active{transform:scale(.96)}
.tile{
  background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  min-height:96px;text-align:center;box-shadow:var(--shadow-sm);transition:transform var(--motion-press-fast) var(--ease-spring),background 160ms
}
.tile:active{transform:scale(.96)}
.tile .tile-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile .tile-icon .icon{width:22px;height:22px}
.tile span{font:500 13px/17px var(--font-body);color:var(--text-secondary)}
.tonal{background:var(--tile-lav);color:var(--tile-lav-fg)}
.tonal.peach{background:var(--tile-peach);color:var(--tile-peach-fg)}
.tonal.mint{background:var(--tile-mint);color:var(--tile-mint-fg)}
.tonal.sky{background:var(--tile-sky);color:var(--tile-sky-fg)}
.tonal.lemon{background:var(--tile-lemon);color:var(--tile-lemon-fg)}
.tonal.rose{background:var(--tile-rose);color:var(--tile-rose-fg)}

/* ============================================================
   8. BUTTONS & CONTROLS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);
  padding:0 20px;border-radius:999px;font:500 15px/22px var(--font-body);white-space:nowrap;
  transition:transform var(--motion-press-fast) var(--ease-spring),background 160ms,box-shadow 160ms,opacity 160ms
}
.btn .icon{width:20px;height:20px}
.btn:active{transform:scale(.96)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.btn-primary{
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;box-shadow:var(--shadow-primary);
  padding:0 22px
}
.btn-primary:hover{box-shadow:0 14px 32px rgba(59,47,163,.34)}
.btn-secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border-strong)}
.btn-secondary:hover{background:var(--primary-subtle)}
.btn-quiet{background:var(--surface-sunken);color:var(--text-secondary)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.24)}
.btn-white{background:#fff;color:var(--indigo-700);box-shadow:0 8px 20px rgba(18,16,42,.16)}
.btn-block{width:100%}
.btn-lg{height:var(--control-h-lg);font-size:15.5px}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-link{height:44px;padding:0 4px;color:var(--text-link);font-weight:600;font-size:14px}
.btn-link:active{opacity:.7}
.iconbtn{
  width:var(--tap);height:var(--tap);border-radius:14px;display:inline-grid;place-items:center;
  background:var(--surface);border:1px solid var(--border-subtle);color:var(--text-secondary);
  position:relative;transition:transform var(--motion-press-fast) var(--ease-spring),background 160ms
}
.iconbtn:hover{background:var(--surface-sunken)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.bare{background:transparent;border-color:transparent}
.iconbtn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field > .f-label{font:500 13px/18px var(--font-body);color:var(--text-secondary);padding-left:2px}
.input-wrap{
  display:flex;align-items:center;gap:10px;height:var(--input-h);padding:0 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);transition:border-color 160ms,box-shadow 160ms,background 160ms
}
.input-wrap:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(109,74,255,.12)}
.input-wrap .icon{color:var(--text-tertiary);width:19px;height:19px}
.input-wrap input,.input-wrap textarea{
  border:0;outline:0;background:transparent;flex:1;min-width:0;font:500 15px/22px var(--font-body);
  color:var(--text);height:100%
}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--text-tertiary);font-weight:400}
.input-wrap textarea{resize:none;padding:12px 0;height:96px}
.input-wrap.err{border-color:var(--border-danger)}
.input-wrap[aria-disabled="true"]{background:var(--surface-sunken);opacity:.7}
.search{height:48px;border-radius:999px;background:var(--surface-sunken);border-color:transparent}
.search:focus-within{background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  height:var(--chip-h);padding:5px 12px 6px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-secondary);font:500 13px/18px var(--font-body);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;
  transition:transform var(--motion-press-fast) var(--ease-spring),background 160ms,color 160ms,border-color 160ms
}
.chip .icon{width:14px;height:14px}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"],.chip.is-selected{background:var(--primary);color:#fff;border-color:transparent}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-sunken);border-radius:999px}
.seg button{
  flex:1;height:36px;border-radius:999px;font:500 13.5px/1 var(--font-body);color:var(--text-tertiary);
  transition:background 180ms,color 180ms,box-shadow 180ms
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-xs);font-weight:600}
.switch{
  width:46px;height:28px;border-radius:999px;background:var(--border-strong);position:relative;
  transition:background 180ms;flex:0 0 auto
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(18,16,42,.24);transition:transform 200ms var(--ease-spring)
}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);min-height:44px}
.check input{width:18px;height:18px;accent-color:var(--primary)}

/* ============================================================
   9. LISTS, BADGES, AVATARS
   ============================================================ */
.list{display:flex;flex-direction:column}
.list-row{
  display:flex;align-items:center;gap:12px;min-height:64px;padding:11px 4px;text-align:left;width:100%;
  border-bottom:1px solid var(--divider);transition:background 160ms,transform var(--motion-press-fast) var(--ease-spring)
}
.list-row:last-child{border-bottom:0}
.list-row.pressable{border-radius:12px}
.list-row.pressable:active{background:var(--surface-sunken);transform:scale(.985)}
.list-row .lr-main{min-width:0;flex:1;overflow:hidden}
.list-row .lr-title{display:block;font:500 15px/21px var(--font-body);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-sub{display:block;font:400 12.5px/18px var(--font-body);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.list-row .lr-trail{white-space:nowrap}
.list-row .lr-trail{font:600 12.5px/18px var(--font-body);color:var(--text-secondary);text-align:right;flex:0 0 auto}
.list-row .lr-trail.due{color:var(--text-danger)}
.list-row .lr-trail.paid{color:var(--text-success)}
.list-row .chev{color:var(--text-tertiary);width:17px;height:17px;flex:0 0 auto}
.avatar{
  border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--font-head);
  background:var(--tile-lav);color:var(--tile-lav-fg);flex:0 0 auto;overflow:hidden
}
.avatar.xs{width:28px;height:28px;font-size:10.5px}
.avatar.sm{width:36px;height:36px;font-size:12px}
.avatar.md{width:44px;height:44px;font-size:14px}
.avatar.lg{width:56px;height:56px;font-size:17px}
.avatar.mint{background:var(--tile-mint);color:var(--tile-mint-fg)}
.avatar.peach{background:var(--tile-peach);color:var(--tile-peach-fg)}
.avatar.sky{background:var(--tile-sky);color:var(--tile-sky-fg)}
.avatar.rose{background:var(--tile-rose);color:var(--tile-rose-fg)}
.avatar.lemon{background:var(--tile-lemon);color:var(--tile-lemon-fg)}
.badge{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;
  font:600 11px/16px var(--font-body);white-space:nowrap;background:var(--badge-neutral-bg);color:var(--badge-neutral-text)
}
.badge .icon{width:12px;height:12px}
.badge.mint{background:var(--success-container);color:var(--on-success-container)}
.badge.coral{background:var(--danger-container);color:var(--on-danger-container)}
.badge.lemon{background:var(--warning-container);color:var(--on-warning-container)}
.badge.sky{background:var(--info-container);color:var(--on-info-container)}
.badge.lav{background:var(--primary-container);color:var(--on-primary-container)}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--text-disabled);flex:0 0 auto}
.unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);flex:0 0 auto}

/* ============================================================
   10. STATS, PROGRESS, CHART, CALENDAR
   ============================================================ */
.stat{
  background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);
  padding:12px 10px;display:flex;flex-direction:column;gap:5px;min-width:0
}
.stat .stat-icon{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;margin-bottom:1px}
.stat .stat-icon .icon{width:15px;height:15px}
.stat .stat-value{font:800 19px/25px var(--font-head);letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--text)}
.stat .stat-label{font:700 9.5px/13px var(--font-head);letter-spacing:.7px;text-transform:uppercase;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .stat-delta{font-size:10.5px;font-weight:600}
.progress{height:8px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.progress > span{display:block;height:100%;border-radius:999px;background:var(--success);transition:width 600ms var(--ease-smooth)}
.progress.primary > span{background:linear-gradient(90deg,var(--grad-a),var(--grad-b))}
.progress.lemon > span{background:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:9px;height:74px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col i{display:block;width:14px;border-radius:999px;background:var(--primary-container);animation:growY 600ms var(--ease-smooth) both;transform-origin:bottom}
.bar-col.today i{background:var(--accent)}
.bar-col span{font-size:9.5px;color:var(--text-tertiary);font-weight:600}
.hero .bar-col span{color:rgba(255,255,255,.82)}
.ring-wrap{position:relative;width:144px;height:144px;flex:0 0 auto}
.ring{width:144px;height:144px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .ring-track{stroke:var(--border-subtle)}
.ring .ring-fill{stroke:url(#ringGrad);transition:stroke-dashoffset 600ms var(--ease-smooth)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center strong{font:800 28px/32px var(--font-head);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ring-center span{font-size:11.5px;color:var(--text-tertiary);font-weight:500}
.ring.small,.ring-wrap.small{width:112px;height:112px}
.ring-wrap.small .ring{width:112px;height:112px}
.ring-wrap.small circle{stroke-width:8}
.ring-wrap.small strong{font-size:22px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar .cal-head{font:600 10px/20px var(--font-body);color:var(--text-tertiary);text-align:center}
.calendar .cal-day{
  height:36px;min-width:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:500 11.5px/1.1 var(--font-body);color:var(--text-secondary);background:var(--surface-sunken);gap:1px
}
.calendar .cal-day em{font-style:normal;font-size:8.5px;font-weight:700}
.calendar .cal-day.present{background:var(--success-container);color:var(--on-success-container)}
.calendar .cal-day.absent{background:var(--danger-container);color:var(--on-danger-container)}
.calendar .cal-day.leave{background:var(--warning-container);color:var(--on-warning-container)}
.calendar .cal-day.empty{background:transparent;color:var(--text-disabled)}
.class-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.class-row .cl-name{width:32px;font:600 12px/1 var(--font-body);color:var(--text-secondary)}
.class-row .progress{flex:1}
.class-row .cl-val{width:40px;text-align:right;font:700 11.5px/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--text)}

/* ============================================================
   11. SKELETON, EMPTY, BANNERS
   ============================================================ */
.skel{background:var(--skeleton);border-radius:8px;position:relative;overflow:hidden}
.skel::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--skeleton-highlight),transparent);
  animation:shimmer 1200ms linear infinite
}
.skel-line{height:12px;margin:6px 0}
.skel-title{height:24px;width:180px;border-radius:8px}
.skel-card{height:120px;border-radius:var(--r-lg)}
.skel-row{height:64px;border-radius:12px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 16px;max-width:290px;margin:0 auto}
.empty .empty-icon{width:64px;height:64px;border-radius:50%;background:var(--surface-sunken);display:grid;place-items:center;color:var(--text-tertiary);margin-bottom:2px}
.empty .empty-icon .icon{width:28px;height:28px}
.empty h3{font:700 16px/22px var(--font-head);color:var(--text)}
.empty p{font:400 12.5px/18px var(--font-body);color:var(--text-secondary)}
.banner{
  display:flex;gap:9px;align-items:flex-start;padding:12px 13px;border-radius:14px;
  font:500 12.5px/18px var(--font-body);border:1px solid transparent
}
.banner .icon{width:17px;height:17px;margin-top:1px}
.banner.error{background:var(--danger-container);color:var(--on-danger-container)}
.banner.info{background:var(--info-container);color:var(--on-info-container)}
.banner.warn{background:var(--warning-container);color:var(--on-warning-container)}
.banner.mint{background:var(--success-container);color:var(--on-success-container)}
.pin{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}

/* ============================================================
   12. SHEET, TOAST, CONFETTI
   ============================================================ */
#sheet-root{position:absolute;inset:0;z-index:var(--z-sheet);pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{
  position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 200ms linear;
  backdrop-filter:blur(2px);border:0;width:100%
}
#sheet-root.open .scrim{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface-raised);border-radius:24px 24px 0 0;
  box-shadow:var(--shadow-xl);max-height:78%;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform 280ms var(--ease-smooth);border-top:1px solid var(--border-subtle)
}
#sheet-root.open .sheet{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:999px;background:var(--border-strong);margin:9px auto 0;flex:0 0 auto}
.sheet-head{padding:12px 20px 6px;display:flex;align-items:flex-start;gap:10px;flex:0 0 auto}
.sheet-head .sh-title{font:800 18px/24px var(--font-head);letter-spacing:-.2px;flex:1}
.sheet-head .sh-sub{font:400 12.5px/18px var(--font-body);color:var(--text-secondary);margin-top:2px}
.sheet-body{padding:8px 20px 16px;overflow-y:auto;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-foot{padding:12px 20px calc(16px + 10px);border-top:1px solid var(--divider);display:flex;flex-direction:column;gap:8px;flex:0 0 auto;background:var(--surface-raised)}
.sheet-foot .row{gap:8px}
#toast-root{position:absolute;left:0;right:0;bottom:96px;z-index:var(--z-toast);display:flex;justify-content:center;pointer-events:none;padding:0 20px;transition:bottom 200ms ease}
.phone[data-nav="0"] #toast-root{bottom:26px}
.phone.has-sheet #toast-root{bottom:204px}
.phone.has-sheet[data-nav="0"] #toast-root{bottom:204px}
.toast{
  display:flex;align-items:center;gap:9px;min-height:48px;max-width:350px;padding:11px 15px;border-radius:14px;
  background:var(--surface-inverse);color:var(--text-inverse);box-shadow:var(--shadow-lg);
  font:500 12.5px/17px var(--font-body);animation:toastIn 220ms ease-out both;pointer-events:auto
}
.toast .icon{width:18px;height:18px;flex:0 0 auto}
.toast.out{animation:toastOut 160ms ease-in both}
#confetti-root{position:absolute;inset:0;pointer-events:none;z-index:var(--z-confetti);overflow:hidden}
.confetti{position:absolute;top:22%;left:50%;width:7px;height:11px;border-radius:2px;animation:confetti 1200ms ease-out forwards}

/* ============================================================
   13. SCREEN-SPECIFIC
   ============================================================ */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0 18px}
.home-head .eyebrow{font:500 12px/17px var(--font-body);color:var(--text-tertiary);margin-bottom:3px}
.home-head h1{font:800 25px/31px var(--font-head);letter-spacing:-.6px;color:var(--text)}
.home-head .row{gap:8px;align-items:center}
.brand-mark{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;
  font:800 30px/1 var(--font-head);background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  box-shadow:var(--shadow-primary);margin:8px auto 18px
}
.login-head{display:flex;justify-content:flex-end;padding-top:4px}
.login-footer{margin-top:22px;display:flex;flex-direction:column;gap:5px}
.or{display:flex;align-items:center;gap:10px;color:var(--text-tertiary);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--divider)}
.success-hero{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 18px 24px;
  animation:fadeIn 240ms ease-out both
}
.success-check{
  width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
  background:var(--success-container);color:var(--text-success);animation:pop 320ms var(--ease-spring) both
}
.success-check .icon{width:36px;height:36px;stroke-width:2.4}
.success-hero h2{font:800 21px/27px var(--font-head);letter-spacing:-.3px}
.success-hero .amt{font:800 30px/36px var(--font-head);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.route-line{display:flex;align-items:center;gap:0;margin:8px 0 2px}
.route-line .rn{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.route-line .rl{height:2px;flex:1;background:linear-gradient(90deg,var(--primary),var(--accent))}
.route-line .rn.end{background:var(--accent)}
.teacher-line{display:flex;align-items:center;gap:12px}
.pay-method{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:14px;
  background:var(--surface);width:100%;text-align:left;transition:border-color 160ms,background 160ms,transform 140ms
}
.pay-method[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-subtle);box-shadow:0 0 0 1px var(--primary)}
.pay-method:active{transform:scale(.985)}
.pay-method .tt{display:block;font:500 13.5px/18px var(--font-body)}
.pay-method .ss{display:block;font:400 11.5px/16px var(--font-body);color:var(--text-tertiary)}
.pay-method .spacer{min-width:0}
.subject-row{display:flex;flex-direction:column;gap:5px;padding:8px 0}
.subject-row .sr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.subject-row .sr-name{font:500 13.5px/18px var(--font-body)}
.subject-row .sr-mark{font:700 12.5px/18px var(--font-body);font-variant-numeric:tabular-nums}
.marks-bar{height:5px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.marks-bar > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));animation:growX 600ms var(--ease-smooth) both}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--divider);margin:0 0 10px}
.tabs button{height:38px;padding:0 12px;font:500 13px/1 var(--font-body);color:var(--text-tertiary);position:relative}
.tabs button[aria-selected="true"]{color:var(--primary);font-weight:600}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--primary)}
.notice-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);text-align:left;width:100%}
.notice-item:last-child{border-bottom:0}
.notice-item .ni-body{min-width:0;flex:1;display:block;overflow:hidden}
.notice-item .ni-title{display:block;font:500 14px/20px var(--font-body);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice-item.unread .ni-title{font-weight:600}
.notice-item .ni-sub{font:400 12px/17px var(--font-body);color:var(--text-secondary);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.notice-item .ni-time{font-size:10.5px;color:var(--text-tertiary);white-space:nowrap;flex:0 0 auto;padding-top:2px}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .tl-row{display:flex;gap:12px;min-height:56px}
.timeline .tl-rail{width:20px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.timeline .tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--primary);background:var(--surface);margin-top:5px}
.timeline .tl-line{width:2px;flex:1;background:var(--divider)}
.timeline .tl-row:last-child .tl-line{display:none}
.timeline .tl-body{padding-bottom:12px;min-width:0}
.timeline .tl-time{font:600 11.5px/16px var(--font-body);color:var(--primary)}
.timeline .tl-name{font:500 13.5px/19px var(--font-body);color:var(--text)}
.timeline .tl-meta{font:400 11.5px/16px var(--font-body);color:var(--text-tertiary)}
.keypad-hint{display:flex;gap:6px;align-items:center;justify-content:center;font-size:10.5px;color:var(--text-tertiary)}
kbd{font:600 10px/1 var(--font-body);padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary)}

/* ============================================================
   14. ANIMATIONS
   ============================================================ */
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes shimmer{100%{transform:translateX(100%)}}
@keyframes growY{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

function icon(name, cls = "") {
  return `<svg class="icon ${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
}
function money(n) { return "₹" + Number(n).toLocaleString("en-IN"); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function child() { return DATA.children.find(c => c.id === state.childId) || DATA.children[0]; }
function dueFor(c = child()) { return (c.id === "aarav" && state.paidAarav) ? 0 : c.due; }
function receiptsFor(c = child()) {
  return (c.id === "aarav" ? state.extraReceipts.concat(c.receipts) : c.receipts);
}
function avatar(nameOrInitials, size = "md", tone = "lav", label = "") {
  const parts = nameOrInitials.trim().split(/\s+/);
  const initials = parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : nameOrInitials.slice(0, 2);
  return `<span class="avatar ${size} ${tone}" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${esc(initials.toUpperCase())}</span>`;
}
function badge(text, tone = "", ic = "") {
  return `<span class="badge ${tone}">${ic ? icon(ic) : ""}${esc(text)}</span>`;
}
function progress(pct, tone = "") {
  return `<div class="progress ${tone}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0, Math.min(100, pct))}%"></span></div>`;
}
function ring(pct, value, label, small = false) {
  const c = 2 * Math.PI * 64;
  const offset = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<div class="ring-wrap ${small ? "small" : ""}" role="img" aria-label="${esc(label)}">
    <svg class="ring ${small ? "small" : ""}" viewBox="0 0 144 144" aria-hidden="true">
      <circle class="ring-track" cx="72" cy="72" r="64"></circle>
      <circle class="ring-fill" cx="72" cy="72" r="64" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
    </svg>
    <div class="ring-center"><strong>${value}</strong><span>${esc(label)}</span></div>
  </div>`;
}

function monthCalendar() {
  const marks = { 4: "absent", 10: "absent", 12: "leave", 18: "present" };
  const days = ["S", "M", "T", "W", "T", "F", "S"].map(d => `<span class="cal-head">${d}</span>`).join("");
  let cells = "";
  for (let i = 0; i < 6; i++) cells += `<span class="cal-day empty" aria-hidden="true"></span>`;
  for (let d = 1; d <= 30; d++) {
    const mark = marks[d];
    const dow = new Date(2026, 10, d).getDay();
    const cls = mark || (dow === 0 ? "" : (d < 18 ? "present" : ""));
    const label = mark ? `<em>${mark === "present" ? "P" : mark === "absent" ? "A" : "L"}</em>` : "";
    cells += `<span class="cal-day ${cls}" ${mark ? `aria-label="18 November, ${mark}"` : ""}>${d}${label}</span>`;
  }
  return `<div class="calendar" role="grid" aria-label="November 2026 attendance">${days}${cells}</div>`;
}
function chartBars() {
  const max = Math.max(...DATA.chart.map(d => d.v));
  return `<div class="bars" role="img" aria-label="Fee collection trend over seven days">${DATA.chart.map(d => `<div class="bar-col ${d.day === "Fri" ? "today" : ""}"><i style="height:${Math.round(d.v / max * 100)}%"></i><span>${d.day}</span></div>`).join("")}</div>`;
}

function navHTML() {
  const items = NAV[state.role] || NAV.teacher;
  return items.map(it => {
    const active = it.tab ? it.tab === state.tab : it.screen === state.screen;
    const attrs = [
      `class="nav-item"`,
      it.sheet ? `data-action="nav-sheet" data-sheet="${it.sheet}"` : `data-action="nav" data-screen="${it.screen}"`,
      it.section ? `data-section="${it.section}"` : "",
      it.filter ? `data-filter="${it.filter}"` : "",
      it.tab ? `data-tab="${it.tab}"` : "",
      active ? `aria-current="page"` : ""
    ].filter(Boolean).join(" ");
    const showBadge = it.badge && state.unread > 0;
    return `<button ${attrs}><span class="nav-icon">${icon(it.icon)}${showBadge ? `<span class="nav-badge">${state.unread}</span>` : ""}</span><span>${esc(it.label)}</span></button>`;
  }).join("");
}

function render(dir = "fade", opts = {}) {
  const view = SCREENS[state.screen] ? SCREENS[state.screen]() : SCREENS["teacher-home"]();
  document.documentElement.dataset.role = state.role;
  appbar.innerHTML = view.bar || "";
  appbar.hidden = !view.bar;
  appbar.style.display = view.bar ? "flex" : "none";
  app.innerHTML = `<section class="screen ${view.flush ? "flush" : ""} anim-${dir}">${view.body}</section>`;
  nav.innerHTML = view.nav === false ? "" : navHTML();
  phone.dataset.nav = view.nav === false ? "0" : "1";
  app.scrollTop = 0;
  if (!opts.keepFocus) {
    requestAnimationFrame(() => {
      const h = app.querySelector("[data-screen-title]");
      if (h) h.focus({ preventScroll: true });
    });
  }
  if (state.section) {
    const sec = document.getElementById("sec-" + state.section);
    if (sec) requestAnimationFrame(() => setTimeout(() => sec.scrollIntoView({ block: "start", behavior: opts.instant ? "auto" : "smooth" }), 80));
  }
  if (view.after) view.after();
}

function go(screen, opts = {}) {
  if (!SCREENS[screen]) return;
  const prev = state.screen;
  if (opts.push && prev !== screen && prev !== "login") state.stack.push(prev);
  if (opts.reset) state.stack = [];
  if (opts.tab) state.tab = opts.tab;
  else if (!opts.keepTab) state.tab = (NAV[state.role] || []).find(i => i.screen === screen && !i.section)?.tab || state.tab;
  state.screen = screen;
  state.section = opts.section || null;
  const dir = opts.dir || (opts.push || state.stack.length ? "push" : "fade");
  render(dir, opts);
  closeSheet(true);
}
function back() {
  if (state.sheet) { closeSheet(); return; }
  const prev = state.stack.pop();
  if (prev) { state.screen = prev; state.section = null; render("pop"); }
  else { go(ROLE_HOME[state.role], { reset: true, dir: "fade" }); }
}
function homeForRole(role) {
  if (role === "accountant") return "admin-home";
  return ROLE_HOME[role] || "teacher-home";
}

/* ============================================================
   10. FEEDBACK — toast, confetti, unread
   ============================================================ */
let toastTimer = null;
function positionToast() {
  const sheet = sheetRoot.querySelector(".sheet");
  if (state.sheet && sheet) {
    const pr = phone.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
    toastRoot.style.bottom = Math.max(24, Math.round(pr.bottom - sr.top + 12)) + "px";
  } else {
    toastRoot.style.bottom = "";
  }
}
function toast(message, tone = "success") {
  const ic = tone === "error" ? "alert-circle" : tone === "info" ? "info" : "check-circle";
  positionToast();
  toastRoot.innerHTML = `<div class="toast" role="status">${icon(ic)}<span>${esc(message)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const t = toastRoot.firstElementChild;
    if (!t) return;
    t.classList.add("out");
    setTimeout(() => { if (toastRoot.firstElementChild === t) toastRoot.innerHTML = ""; }, 180);
  }, 2600);
}
function confetti() {
  if (state.reduceMotion || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#3B2FA3", "#6D4AFF", "#F4B740", "#12A87A", "#2E7CF6", "#E5484D", "#A796EC"];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.left = (30 + Math.random() * 40) + "%";
    s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", (Math.random() * 280 - 140).toFixed(0) + "px");
    s.style.setProperty("--dy", (120 + Math.random() * 320).toFixed(0) + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
    s.style.animationDelay = (Math.random() * 120).toFixed(0) + "ms";
    s.style.width = (5 + Math.random() * 5).toFixed(0) + "px";
    confettiRoot.appendChild(s);
    setTimeout(() => s.remove(), 1600);
  }
}
function recalcUnread() {
  state.unread = DATA.notices.filter(n => n.unread && !state.read[n.id]).length;
}
function resolvedTheme() {
  if (state.theme === "system") return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  return state.theme;
}
function applyTheme() {
  document.documentElement.dataset.theme = resolvedTheme();
  try { store.set("theme", state.theme); } catch (e) {}
}

function openSheet(type, payload = {}) {
  state.sheet = { type, payload };
  state.lastFocus = document.activeElement;
  if (type === "payment") { state.paymentStep = "form"; state.paymentError = ""; }
  if (type === "student") { state.studentId = payload.id || null; state.studentTab = "overview"; }
  if (type === "notice" && payload.id) {
    const id = payload.id;
    setTimeout(() => {
      if (state.sheet && state.sheet.type === "notice" && state.sheet.payload.id === id && !state.read[id]) {
        state.read[id] = true;
        recalcUnread();
        render("fade", { keepFocus: true });
        renderSheet();
      }
    }, 600);
  }
  renderSheet();
}
function closeSheet(silent = false) {
  state.sheet = null;
  phone.classList.remove("has-sheet");
  toastRoot.style.bottom = "";
  sheetRoot.classList.remove("open");
  sheetRoot.innerHTML = "";
  app.style.overflow = "";
  app.inert = false; nav.inert = false; appbar.inert = false;
  if (!silent && state.lastFocus && state.lastFocus.focus) {
    try { state.lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }
}

   ============================================================ */
function applyStudentFilter() {
  const q = state.studentsQuery.trim().toLowerCase();
  const rows = document.querySelectorAll("#student-list .student-row");
  let visible = 0;
  rows.forEach(row => {
    const hay = row.dataset.hay || "";
    const show = !q || hay.indexOf(q) >= 0;
    row.hidden = !show;
    if (show) visible++;
  });
  const empty = document.getElementById("students-empty");
  const list = document.getElementById("student-list");
  if (empty) empty.classList.toggle("hidden", visible > 0);
  if (list) list.classList.toggle("hidden", visible === 0);
  const count = document.getElementById("student-count");
  if (count) count.textContent = visible + " student" + (visible === 1 ? "" : "s") + (q ? ` matching “${state.studentsQuery}”` : "");
}

function doLogin() {
  if (!state.loginId.trim() || !state.password) {
    state.loginError = "Please enter your Login ID and password.";
    render("fade", { keepFocus: true });
    return;
  }
  if (state.password.length < 4) {
    state.loginError = "Wrong login ID or password. Please try again.";
    render("fade", { keepFocus: true });
    return;
  }
  state.loginError = "";
  state.signingIn = true;
  render("fade", { keepFocus: true });
  setTimeout(() => {
    state.signingIn = false;
    state.stack = [];
    state.screen = homeForRole(state.role);
    state.tab = "home";
    state.section = null;
    render("fade", { keepFocus: true });
    toast("Signed in as " + currentUser().name);
  }, 900);
}

function payNow() {
  if (state.paymentStep === "processing") return;
  state.paymentStep = "processing";
  renderSheet();
  setTimeout(() => {
    if (state.failPayment) {
      state.paymentStep = "failure";
      state.failPayment = false;
      updateDevButtons();
      renderSheet();
    } else {
      const c = child();
      const amount = dueFor(c);
      const method = state.paymentMethod === "card" ? "Card" : state.paymentMethod === "netbanking" ? "Netbanking" : "UPI";
      state.paidAmount = amount;
      state.paidAarav = true;
      store.set("paidAarav", "1");
      state.extraReceipts.unshift({ id: "RCPT-2026-0412", amount, method, date: "18 Nov 2026" });
      state.paymentStep = "success";
      renderSheet();
      confetti();
      recalcUnread();
    }
  }, 1200);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "close-sheet") { closeSheet(); return; }
  if (el.getAttribute("aria-disabled") === "true" && action !== "close-sheet") {
    if (action === "check-in") toast("Move closer to campus or enable location to check in.", "error");
    return;
  }
  switch (action) {
    case "go": {
      const screen = el.dataset.screen;
      const section = el.dataset.section || null;
      let tab = el.dataset.tab;
      if (el.dataset.segment) { state.attendanceSegment = el.dataset.segment; tab = "attendance"; }
      if (el.dataset.filter) state.studentFilter = el.dataset.filter;
      if (tab) state.tab = tab;
      go(screen, { push: el.dataset.push === "1", section, tab, dir: "push" });
      break;
    }
    case "nav": {
      const screen = el.dataset.screen;
      const section = el.dataset.section || null;
      const tab = el.dataset.tab || null;
      if (el.dataset.filter) state.studentFilter = el.dataset.filter;
      if (tab) state.tab = tab;
      go(screen, { reset: true, section, tab, dir: "fade" });
      break;
    }
    case "nav-sheet":
      openSheet(el.dataset.sheet);
      break;
    case "sheet":
      openSheet(el.dataset.sheet);
      break;
    case "back": back(); break;
    case "set-role": {
      state.role = el.dataset.role;
      const r = ROLES.find(x => x.id === state.role);
      state.loginId = r ? r.login : "";
      state.loginError = "";
      render("fade", { keepFocus: true });
      break;
    }
    case "login": doLogin(); break;
    case "demo-login": {
      const r = ROLES.find(x => x.id === state.role) || ROLES[1];
      state.loginId = r.login;
      state.password = "demo1234";
      state.loginError = "";
      render("fade", { keepFocus: true });
      toast("Demo credentials filled. Press Sign in.", "info");
      break;
    }
    case "toggle-password":
      state.showPassword = !state.showPassword;
      render("fade", { keepFocus: true });
      break;
    case "toggle-theme": {
      const next = resolvedTheme() === "dark" ? "light" : "dark";
      state.theme = next;
      applyTheme();
      render("fade", { keepFocus: true });
      toast(next === "dark" ? "Dark mode on" : "Light mode on", "info");
      break;
    }
    case "set-theme":
      state.theme = el.dataset.theme;
      applyTheme();
      render("fade", { keepFocus: true });
      break;
    case "toggle-motion": {
      state.reduceMotion = !state.reduceMotion;
      store.set("reduce", state.reduceMotion ? "1" : "0");
      document.documentElement.classList.toggle("reduce-motion", state.reduceMotion);
      updateDevButtons();
      render("fade", { keepFocus: true });
      toast(state.reduceMotion ? "Reduced motion on" : "Reduced motion off", "info");
      break;
    }
    case "toggle-notif": {
      state.notifs = state.notifs || { fees: true, attendance: true, notices: true };
      const k = el.dataset.key;
      state.notifs[k] = !state.notifs[k];
      render("fade", { keepFocus: true });
      toast("Notification preference saved.", "success");
      break;
    }
    case "check-in": {
      if (state.gps !== "on-campus") { toast("Move closer to campus or enable location to check in.", "error"); return; }
      state.attendance = "saving-in";
      render("fade", { keepFocus: true });
      setTimeout(() => {
        state.attendance = "success-in";
        render("pop", { keepFocus: true });
        confetti();
      }, 900);
      break;
    }
    case "checkout-open":
      openSheet("checkout");
      break;
    case "confirm-checkout":
      closeSheet(true);
      state.attendance = "saving-out";
      render("fade", { keepFocus: true });
      setTimeout(() => {
        state.attendance = "success-out";
        render("pop", { keepFocus: true });
        confetti();
      }, 700);
      break;
    case "attendance-done":
      state.attendance = state.attendance === "success-out" ? "checked-out" : "checked-in";
      state.screen = "teacher-home";
      state.stack = [];
      state.tab = "home";
      render("fade");
      toast(state.attendance === "checked-out" ? "Day complete. See you tomorrow." : "Attendance saved for today.");
      break;
    case "refresh-location": {
      if (state.gps === "denied") { toast("Location permission is off. Open Settings to allow access.", "error"); return; }
      state.gps = "locating";
      render("fade", { keepFocus: true });
      setTimeout(() => {
        state.gps = "on-campus";
        if (state.screen === "teacher-attendance") render("fade", { keepFocus: true });
        toast("Location verified · you’re on campus.");
      }, 900);
      break;
    }
    case "academics-tab":
      state.homeworkTab = el.dataset.tab;
      render("fade", { keepFocus: true });
      break;
    case "select-child":
      state.childId = el.dataset.child;
      store.set("child", state.childId);
      render("fade", { keepFocus: true });
      toast("Showing " + child().name, "info");
      break;
    case "pay-open":
      if (dueFor() === 0) { toast("No dues right now.", "info"); return; }
      openSheet("payment");
      break;
    case "pay-method":
      state.paymentMethod = el.dataset.method;
      renderSheet();
      break;
    case "pay":
      payNow();
      break;
    case "pay-done":
      closeSheet(true);
      render("fade", { keepFocus: true });
      toast("Payment recorded. Receipt RCPT-2026-0412 is ready.");
      break;
    case "payment-filter":
      state.paymentFilter = el.dataset.filter;
      render("fade", { keepFocus: true });
      break;
    case "receipt":
      toast("Receipt " + el.dataset.id + " shared.");
      break;
    case "exam-term":
      state.examTerm = el.dataset.term;
      render("fade", { keepFocus: true });
      break;
    case "download":
      toast("PDF saved to Downloads.", "success");
      break;
    case "share":
      toast("Report shared with your family.", "success");
      break;
    case "open-notice":
      openSheet("notice", { id: el.dataset.id });
      break;
    case "mark-read": {
      const id = state.sheet && state.sheet.payload ? state.sheet.payload.id : null;
      if (id) { state.read[id] = true; recalcUnread(); }
      render("fade", { keepFocus: true });
      renderSheet();
      toast("Marked as read.");
      break;
    }
    case "mark-all-read":
      DATA.notices.forEach(n => { if (n.unread) state.read[n.id] = true; });
      recalcUnread();
      render("fade", { keepFocus: true });
      toast("All caught up.");
      break;
    case "inbox-filter":
      state.inboxFilter = el.dataset.filter;
      render("fade", { keepFocus: true });
      break;
    case "open-student":
      openSheet("student", { id: el.dataset.id });
      break;
    case "student-tab":
      state.studentTab = el.dataset.tab;
      renderSheet();
      break;
    case "student-filter":
      state.studentFilter = el.dataset.filter;
      render("fade", { keepFocus: true });
      break;
    case "clear-search":
      state.studentsQuery = "";
      render("fade", { keepFocus: true });
      break;
    case "approval": {
      state.approvalsDone = state.approvalsDone || {};
      state.approvalsDone[el.dataset.id] = el.dataset.decision;
      render("fade", { keepFocus: true });
      toast(el.dataset.decision === "approve" ? "Leave approved and staff notified." : "Request declined and staff notified.", el.dataset.decision === "approve" ? "success" : "info");
      break;
    }
    case "attendance-segment":
      state.attendanceSegment = el.dataset.segment;
      render("fade", { keepFocus: true });
      break;
    case "role-switch":
      state.pendingRole = el.dataset.role;
      if (state.pendingRole === state.role) { toast("You’re already in this workspace.", "info"); return; }
      openSheet("role-switch");
      break;
    case "confirm-role": {
      const role = state.pendingRole;
      state.role = role;
      closeSheet(true);
      state.stack = [];
      state.tab = "home";
      state.screen = homeForRole(role);
      state.section = null;
      render("fade");
      const r = ROLES.find(x => x.id === role);
      toast("Switched to " + (r ? r.label : "workspace") + ".");
      break;
    }
    case "signout-open":
      openSheet("signout");
      break;
    case "confirm-signout":
      closeSheet(true);
      state.stack = [];
      state.screen = "login";
      state.tab = "home";
      state.loginId = "";
      state.password = "";
      state.loginError = "";
      state.showPassword = false;
      render("fade");
      toast("Signed out.", "info");
      break;
    case "copy-login": {
      const v = el.dataset.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(v).catch(() => {});
      }
      toast("Login ID copied.");
      break;
    }
    case "compose-chip": {
      state.composeText = (state.composeText ? state.composeText + " " : "") + el.dataset.value + ": ";
      renderSheet();
      const ta = sheetRoot.querySelector('[data-field="composeText"]');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      break;
    }
    case "compose-send": {
      if (!state.composeText.trim()) { toast("Write a message before sending.", "error"); return; }
      state.composeText = "";
      closeSheet(true);
      toast("Message sent to the school office.");
      break;
    }
    case "hw-class":
      state.hwForm.cls = el.dataset.value;
      renderSheet();
      break;
    case "hw-notify":
      state.hwForm.notify = !state.hwForm.notify;
      renderSheet();
      break;
    case "homework-submit": {
      const f = state.hwForm;
      if (f.title.trim().length < 5) { f.error = "Add a title of at least 5 characters."; renderSheet(); return; }
      if (!f.due) { f.error = "Choose a due date."; renderSheet(); return; }
      f.error = "";
      const dueDate = new Date(f.due + "T12:00:00");
      const label = dueDate.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
      state.postedHomework.unshift({
        id: "h" + Date.now(), title: f.title.trim(), cls: f.cls, due: label,
        submitted: "0/42", subject: "Mathematics", instructions: f.instructions, notify: f.notify
      });
      state.hwForm = { cls: f.cls, title: "", due: "2026-11-19", instructions: "", notify: true, error: "" };
      closeSheet(true);
      render("fade", { keepFocus: true });
      toast("Homework posted" + (f.notify ? " · 28 parents notified" : "") + ".");
      break;
    }
    case "call":
      toast("Calling " + el.dataset.name + " · " + el.dataset.phone + "…", "info");
      break;
    case "message":
      toast("Opening a message to " + el.dataset.name + "…", "info");
      break;
    case "refresh": {
      state.loading = true;
      render("fade", { keepFocus: true });
      setTimeout(() => {
        state.loading = false;
        render("fade", { keepFocus: true });
        toast("Updated just now.");
      }, 800);
      break;
    }
    case "toast":
      toast(el.dataset.message || "Done.");
      break;
    case "noop":
      break;
  }
});

/* ============================================================
   13. INPUTS, KEYBOARD, FOCUS
   ============================================================ */
document.addEventListener("input", (e) => {
  const field = e.target.dataset.field;
  if (!field) return;
  if (field === "studentQuery") {
    state.studentsQuery = e.target.value;
    applyStudentFilter();
    return;
  }
  if (field === "hwTitle" || field === "hwDue" || field === "hwInstructions") {
    state.hwForm[field.replace("hw", "").toLowerCase()] = e.target.value;
    return;
  }
  state[field] = e.target.value;
  if (field === "loginId" || field === "password") state.loginError = "";
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.sheet) { e.preventDefault(); closeSheet(); return; }
    if (state.screen !== "login") { e.preventDefault(); back(); }
  }
  if (e.key === "/" && !state.sheet) {
    const search = document.querySelector('[data-field="studentQuery"]');
    if (search) { e.preventDefault(); search.focus(); }
  }
  if (e.key === "Tab" && state.sheet) {
    const sheet = sheetRoot.querySelector(".sheet");
    if (!sheet) return;
    const focusables = Array.from(sheet.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(n => n.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   14. DEV CONTROLS / SCALING / INIT
   ============================================================ */
const devGps = document.getElementById("dev-gps");
const devFail = document.getElementById("dev-fail");
const devMotion = document.getElementById("dev-motion");
function updateDevButtons() {
  const gpsLabel = { "on-campus": "GPS: on campus", "off-campus": "GPS: off campus", "denied": "GPS: permission off" };
  if (devGps) devGps.textContent = gpsLabel[state.gps] || "GPS: on campus";
  if (devFail) devFail.setAttribute("aria-pressed", state.failPayment ? "true" : "false");
  if (devMotion) devMotion.setAttribute("aria-pressed", state.reduceMotion ? "true" : "false");
  if (devMotion) devMotion.textContent = state.reduceMotion ? "Motion reduced" : "Reduce motion";
}
if (devGps) devGps.addEventListener("click", () => {
  state.gps = state.gps === "on-campus" ? "off-campus" : state.gps === "off-campus" ? "denied" : "on-campus";
  updateDevButtons();
  if (state.screen === "teacher-attendance") render("fade", { keepFocus: true });
  toast("Demo GPS: " + state.gps.replace("-", " "), "info");
});
if (devFail) devFail.addEventListener("click", () => {
  state.failPayment = !state.failPayment;
  updateDevButtons();
  toast(state.failPayment ? "Next payment will fail." : "Next payment will succeed.", "info");
});
if (devMotion) devMotion.addEventListener("click", () => {
  state.reduceMotion = !state.reduceMotion;
  store.set("reduce", state.reduceMotion ? "1" : "0");
  document.documentElement.classList.toggle("reduce-motion", state.reduceMotion);
  updateDevButtons();
  if (state.screen === "profile") render("fade", { keepFocus: true });
});
const devReset = document.getElementById("dev-reset");
if (devReset) devReset.addEventListener("click", () => {
  store.clear();
  state.read = {};
  state.paidAarav = false;
  state.extraReceipts = [];
  state.postedHomework = [];
  location.reload();
});

function fitStage() {
  const head = document.querySelector(".demo-head");
  const headH = head ? head.offsetHeight : 60;
  const availW = window.innerWidth - 32;
  const availH = window.innerHeight - headH - 110;
  const scale = Math.max(0.4, Math.min(1, availW / 390, availH / 844));
  const stage = document.getElementById("stage");
  const wrap = document.getElementById("stage-wrap");
  if (stage) stage.style.transform = "scale(" + scale + ")";
  if (wrap) wrap.style.height = Math.ceil(844 * scale) + "px";
}
window.addEventListener("resize", fitStage);

state.notifs = { fees: true, attendance: true, notices: true };
state.approvalsDone = {};
state.hwForm = { cls: "VIII-A", title: "", due: "2026-11-19", instructions: "", notify: true, error: "" };
state.paymentFilter = "all";
state.attendanceSegment = "students";
state.loginId = "";
state.password = "";

/* Deep links for review: ?role=parent&screen=parent-fees&theme=dark&paid=1 */
(function applyParams() {
  try {
    const p = new URLSearchParams(location.search);
    const wanted = p.get("screen");
    if (wanted && SCREENS[wanted]) {
      if (!p.get("role")) {
        if (wanted.indexOf("parent") === 0) state.role = "parent";
        else if (wanted.indexOf("teacher") === 0) state.role = "teacher";
        else if (wanted.indexOf("admin") === 0) state.role = "admin";
      }
      state.screen = wanted;
      const item = (NAV[state.role] || []).find(i => i.screen === wanted);
      state.tab = item ? item.tab : "home";
    }
    const role = p.get("role");
    if (role && ROLES.some(r => r.id === role)) {
      state.role = role;
      if (!wanted) { state.screen = homeForRole(role); state.tab = "home"; }
    }
    const theme = p.get("theme");
    if (theme && ["light", "dark", "system"].indexOf(theme) >= 0) state.theme = theme;
    const c = p.get("child");
    if (c && DATA.children.some(x => x.id === c)) state.childId = c;
    if (p.get("paid") === "1") state.paidAarav = true;
    if (p.get("paid") === "0") state.paidAarav = false;
    if (p.get("unread") === "0") DATA.notices.forEach(n => { state.read[n.id] = true; });
    state.unread = DATA.notices.filter(n => n.unread && !state.read[n.id]).length;
  } catch (e) {}
})();

applyTheme();
document.documentElement.classList.toggle("reduce-motion", state.reduceMotion);
updateDevButtons();
fitStage();
render("fade", { keepFocus: true });

/* Keep system theme live when the OS changes. */
try {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (state.theme === "system") { applyTheme(); render("fade", { keepFocus: true }); }
  });
} catch (e) {}

</script>
